replicaCount: 1

namespace: wlth-ai

image:
  repository: "686797373029.dkr.ecr.us-east-2.amazonaws.com/orbtl-relay-dev"
  tag: "latest"
  pullSecret: ecr-creds

service:
  name: orbtl-relay
  type: ClusterIP
  ports:
    - name: http
      port: 8091
      targetPort: 8091
      protocol: TCP
    - name: tcp
      port: 9090
      targetPort: 9090
      protocol: TCP

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Network Load Balancer for TCP connections
nlb:
  enabled: true
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"

env:
  SPRING_PROFILES_ACTIVE: dev
  REDIS_HOST: "redis-master.wlth-ai.svc.cluster.local"
  REDIS_PORT: "6379"
  MONOLITH_URL: "http://wlth-ai.wlth-ai.svc.cluster.local:8080"
  TCP_PORT: "9090"
  MAX_CONNECTIONS: "1000"

serviceAccount:
  create: false
  name: orbtl-relay-dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::686797373029:role/orbtl-relay-dev