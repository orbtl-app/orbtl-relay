server:
  port: 8091

spring:
  application:
    name: orbtl-relay-test
  
  redis:
    host: localhost
    port: 6379
    password: 
    timeout: 1000ms
    lettuce:
      pool:
        max-active: 5
        max-idle: 3
        min-idle: 1

relay:
  tcp:
    port: 9091  # Different port for testing
    max-connections: 100
    heartbeat-interval: 10s
    auth-timeout: 2s
  
  auth:
    monolith-url: http://localhost:8080
    cache-ttl: 1m
  
  routing:
    max-message-size: 32768
    
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.orbtl.relay: TRACE
    io.netty: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    reactor.netty.http.client: DEBUG