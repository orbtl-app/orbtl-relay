# Production environment configuration
# Values will be overridden by AWS Secrets Manager and Parameter Store

spring:
  config:
    import:
      - optional:aws-secretsmanager:orbtl-prod-secrets
      - optional:aws-parameterstore:/config/prod/relay

  data:
    redis:
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

relay:
  tcp:
    max-connections: ${.relay.max-connections:2000}
  auth:
    cache-ttl: 10m

logging:
  level:
    com.orbtl.relay: INFO
    io.netty: WARN
    org.springframework.data.redis: INFO
    org.springframework.web.reactive.function.client: INFO
    reactor.netty.http.client: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n'
  file:
    name: /var/log/orbtl-relay/application.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
